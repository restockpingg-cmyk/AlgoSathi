[project]
name = "algosathi"
version = "0.1.0"
description = "Personal algo trading bot for Indian equities/F&O via Upstox"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "loguru>=0.7",
    "tenacity>=8.2",
    "PyYAML>=6.0",
    "supabase>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
dashboard = [
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
include = ["algosathi*"]
