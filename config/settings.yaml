# Non-secret AlgoSathi configuration. Secrets (API keys, live-trading confirmation) live in .env.

mode: paper # paper | live

symbol: INFY

# Scan a universe and trade every symbol whose entry conditions are met, all using the one
# active strategy. Leave empty to trade only `symbol` above.
#
# Read risk.max_open_positions before widening this: it is the only thing stopping a broad
# universe from opening a position in every name at once, and it is shared across symbols,
# not per symbol. With order_quantity sizing, N open positions is N x the capital at risk.
symbols: []
# symbols: [INFY, TCS, WIPRO, HCLTECH, TECHM]

exchange: NSE_EQ

strategy:
  # supabase = run whichever strategy is marked active for this symbol in the dashboard,
  # yaml = ignore the dashboard and use the name/params below.
  source: supabase
  name: sma_crossover
  fast_period: 9
  slow_period: 21
  ma_type: sma # sma | ema

risk:
  order_quantity: 1
  max_daily_loss: 5000
  max_open_positions: 1
  # Set capital_per_trade to size by money instead of a fixed quantity; lot_size rounds down
  # to whole lots (1 for equity, the contract size for F&O).
  capital_per_trade: null
  lot_size: 1

  # Position-level exits, checked before the strategy on every candle. Percentages are of the
  # entry price; times are exchange-local (IST). null switches a rule off.
  exits:
    # Two layers, on purpose. This one is placed as a real SL-M order resting at the exchange
    # the moment we enter, so it triggers on tick. It is set wide because the trailing stop
    # below does the ordinary work — this exists for the gap or crash that moves further than
    # 2% inside a single poll window, which the polled stop would be minutes late for. On the
    # INFY window it never fires, which is the point: it costs nothing until it matters.
    stop_loss_pct: 2.0
    target_pct: null
    # Caps the give-back from the best price since entry. On the INFY window this cut max
    # drawdown from 40.20 to 12.00 — the drawdown reduction is the point; treat the P&L
    # difference as noise. A trailing level moves with the high-water mark so it cannot rest
    # at the exchange; it stays polled, and is therefore only as fast as the candle interval.
    trailing_stop_pct: 1.0
    # Deliberately off. This strategy holds positions across days (RSI can take days to
    # reach 65), so forcing a daily square-off cut INFY from +110 to +23 and NIFTY to -390.
    # Turn it on for a genuinely intraday strategy, where being flat by 15:15 avoids the
    # broker force-closing MIS positions at whatever price it likes.
    square_off_time: null
    no_entry_before: null
    no_entry_after: null

paper:
  starting_cash: 100000

polling_interval_seconds: 60
candle_interval_minutes: 5
